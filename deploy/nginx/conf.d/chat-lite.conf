upstream chat_api {
    server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
    server 182.61.144.18:3000 max_fails=3 fail_timeout=30s;
}

# Each owner has exactly one server. Never fail over a conversation to a node
# with an empty local workspace. These names/topology and the split are stable.
upstream chat_owner_local {
    server host.docker.internal:3000;
}

upstream chat_owner_remote {
    server 182.61.144.18:3000;
}

map $uri $conversation_route_kind {
    default none;
    ~^/api/conversations/ uri;
    ~^/api/(chat|upload)$ header;
}

# Use the original URI so percent-encoded IDs cannot acquire another spelling.
# Canonical IDs match Go idgen.NewID("conv"): conv_ plus 24 URL-safe characters.
map $request_uri $conversation_uri_id {
    default "";
    "~^/api/conversations/(?<canonical_uri_id>conv_[A-Za-z0-9_-]{24})(?:/|[?]|$)" $canonical_uri_id;
}

map $http_x_conversation_id $conversation_header_id {
    default "";
    "~^(?<canonical_header_id>conv_[A-Za-z0-9_-]{24})$" $canonical_header_id;
}

map $conversation_route_kind $conversation_route_id {
    default "";
    uri $conversation_uri_id;
    header $conversation_header_id;
}

map "$conversation_route_kind:$conversation_route_id" $conversation_route_invalid {
    default 0;
    "uri:" 1;
    "header:" 1;
}

split_clients $conversation_route_id $conversation_owner {
    50% chat_owner_local;
    * chat_owner_remote;
}

map $conversation_route_id $chat_upstream {
    "" chat_api;
    default $conversation_owner;
}

server {
    listen 80;
    server_name chat.zzxandyl.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.zzxandyl.cn;

    ssl_certificate /etc/letsencrypt/live/chat.zzxandyl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.zzxandyl.cn/privkey.pem;

    root /var/www/chat;
    index index.html;

    location /api/ {
        if ($conversation_route_invalid) { return 400; }
        client_max_body_size 100m;
        proxy_pass http://$chat_upstream;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

