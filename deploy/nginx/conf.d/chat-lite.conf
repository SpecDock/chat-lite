upstream chat_api {
    server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
    server 182.61.144.18:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name chat.zzxandyl.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.zzxandyl.cn;

    ssl_certificate /etc/letsencrypt/live/chat.zzxandyl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.zzxandyl.cn/privkey.pem;

    root /var/www/chat;
    index index.html;

    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://chat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name zzxandyl.cn www.zzxandyl.cn;

    location /.well-known/acme-challenge/ {
