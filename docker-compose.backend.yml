services:
  chat-lite:
    build: .
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - UPLOAD_DIR=/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - table-sandbox-runtime:/run/table-sandbox
    depends_on:
      - table-sandbox
    ports:
      - "3000:3000"
    restart: unless-stopped

  table-sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    volumes:
      - table-sandbox-runtime:/run/table-sandbox
    read_only: true
    tmpfs:
      - /tmp
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    restart: unless-stopped

volumes:
  table-sandbox-runtime:
