services:
  chat-lite:
    build: .
    image: chat-lite-backend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - UPLOAD_DIR=/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - /var/lib/chat-lite/table-sandbox:/run/table-sandbox
    depends_on:
      - sandbox-broker
    ports:
      - "3000:3000"
    restart: unless-stopped

  sandbox-broker:
    image: chat-lite-backend
    command: ["/app/sandbox-broker"]
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/chat-lite/table-sandbox:/run/table-sandbox

  table-sandbox:
    image: chat-lite-table-sandbox
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    profiles: ["image"]
