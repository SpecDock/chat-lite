plugins {
    id 'com.android.application'
}

android {
    namespace 'com.specdock.chatlite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.specdock.chatlite'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Platform Android APIs only; no third-party dependencies.
}
