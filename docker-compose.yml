services:
  chat-lite:
    build:
      context: .
      args:
        VITE_STREAM_MARKDOWN_INTERVAL_MS: ${VITE_STREAM_MARKDOWN_INTERVAL_MS:-50}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - NODE_ENV=production
    volumes:
      - ./data:/data
    restart: unless-stopped
