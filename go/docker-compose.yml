services:
  postgres:
    container_name: chat-lite-postgres
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: chatlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatlite
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatlite -d chatlite"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    container_name: chat-lite-minio
    image: openvidu/minio:RELEASE.2026-09-22T19-25-18Z
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  pg_data:
  minio_data:
